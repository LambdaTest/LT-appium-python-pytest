trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # These link to the secret variables you will create in the ADO UI
  LT_USERNAME: $(LT_USERNAME)
  LT_ACCESS_KEY: $(LT_ACCESS_KEY)

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
  displayName: 'Install Python 3.10'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Dependencies'

- script: |
    pytest tests/
  displayName: 'Run LambdaTest Appium Tests'
  env:
    # This maps your ADO Secret Variables to the Python Environment
    LT_USERNAME: $(LT_USERNAME)
    LT_ACCESS_KEY: $(LT_ACCESS_KEY)
